name: Daily digest

on:
  schedule:
    # 09:47 UTC = 4:47am Central (CDT) / 3:47am (CST). An off-the-hour minute,
    # because GitHub delays top-of-the-hour schedules by hours when busy.
    - cron: "47 9 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      rebuild_date:
        description: "Re-summarize a past day from its archive (YYYY-MM-DD); leave empty for today"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A queued run was checked out at trigger time; build on the newest main.
      - name: Sync to latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REBUILD_DATE: ${{ inputs.rebuild_date }}
          DIGEST_TZ: ${{ vars.DIGEST_TZ }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python -m daily_feed

      - name: Commit
        env:
          REBUILD_DATE: ${{ inputs.rebuild_date }}
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs digests
          git diff --cached --quiet || git commit -m "Digest for ${REBUILD_DATE:-$(date -u +%F)}"
          # If something landed meanwhile, rebase onto it (keeping this run's files) and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1
