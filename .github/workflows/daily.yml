name: Daily digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 6am Pacific (PDT) / 5am (PST)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DIGEST_TZ: ${{ vars.DIGEST_TZ }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python -m daily_feed

      - name: Commit
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs digests
          git diff --cached --quiet || git commit -m "Digest for $(date -u +%F)"
          git push
